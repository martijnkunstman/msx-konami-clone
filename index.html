<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Phoenix Knight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #stage { position: relative; line-height: 0; }
    #screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #crt {
      position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(to bottom, rgba(0,0,0,0) 60%, rgba(0,0,0,.28) 60%);
      box-shadow: inset 0 0 60px rgba(0,0,0,.55);
    }
  </style>
</head>
<body>
  <div id="wrap"><div id="stage">
    <canvas id="screen" width="256" height="212"></canvas>
    <div id="crt"></div>
  </div></div>
  <script src="src/audio.js"></script>
  <script src="src/gfx.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
